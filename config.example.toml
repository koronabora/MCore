# Copy to /etc/mcore/config.toml. All runtime data stays outside the repository.
host = "0.0.0.0"
port = 45873
public_url = "https://10.16.16.31:45873"
state_dir = "/var/lib/mcore"
cache_dir = "/var/cache/mcore/video"
cache_bytes = 107374182400
sync_seconds = 21600
torapi_url = "http://127.0.0.1:8443"
tls_cert = "/etc/mcore/tls.crt"
tls_key = "/etc/mcore/tls.key"
providers = ["rutracker", "kinozal"]

[torrent]
# Forward this port to the server for BOTH TCP and UDP (uTP and DHT).
# Keep the external and internal port identical. Independent of the HTTPS API.
listen_port = 51413
listen_addresses = ["0.0.0.0"] # Add "::" to also listen on IPv6.
enable_dht = true
enable_pex = true
enable_utp = true
enable_lsd = false
# Prefer explicit forwarding; enable these only if automatic router mapping is wanted.
enable_upnp = false
enable_natpmp = false
connections_limit = 200
download_rate_limit = 0 # bytes/second; 0 = unlimited
upload_rate_limit = 0   # bytes/second; 0 = unlimited
# 0/0 lets the OS choose ephemeral source ports for outbound TCP peer connections.
outgoing_port_first = 0
outgoing_port_last = 0

# Optional: use Jackett instead of TorAPI for the configured providers.
# API key file must be readable by mcore, outside the repository.
# [jackett]
# url = "http://127.0.0.1:9117"
# api_key_file = "/etc/mcore/jackett.key"
# [jackett.indexers]
# rutracker = "rutracker"
# kinozal = "kinozal-magnet"
